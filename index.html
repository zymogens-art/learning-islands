:root{
  --sea:#2a8bab;
  --sea-deep:#1a6280;
  --shallow:#86d0dc;
  --sand:#f4e1b0;
  --paper:#fbf7ec;
  --card:#ffffff;
  --ink:#16313b;
  --ink-soft:#4d6670;
  --line:#dfd5bd;
  --buoy:#ff6b3d;

  --font-display:"Chiron GoRound TC","Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;

}
*{box-sizing:border-box}
html,body{margin:0}
body{

  padding-block:0 48px;
}
img{max-width:100%}
[hidden]{display:none!important}
button{font:inherit;color:inherit}

.wrap{max-width:1120px;margin:0 auto}

/* ---------- 頂部航海日誌 ---------- */
header.top{
  display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 24px;
  padding-block:28px 18px;
}
.brand h1{
  font-family:var(--font-display);font-weight:900;font-size:clamp(34px,6vw,54px);
  line-height:1;margin:0;letter-spacing:.04em;color:var(--sea-deep);
}
.brand h1 span{color:var(--buoy)}
.brand p{margin:8px 0 0;color:var(--ink-soft);max-width:34em;text-wrap:balance}
.log{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.passport{
  display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--ink);
  border-radius:14px;padding:6px 14px 6px 8px;box-shadow:3px 3px 0 var(--ink);
}
.passport .ring{width:40px;height:40px}
.passport b{font-family:var(--font-display);font-size:20px;font-variant-numeric:tabular-nums}
.passport small{display:block;color:var(--ink-soft);font-size:12px;line-height:1.2}
.btn{
  cursor:pointer;border:2px solid var(--ink);background:var(--buoy);color:#fff;
  font-family:var(--font-display);font-weight:700;font-size:15px;
  padding:9px 16px;border-radius:12px;box-shadow:3px 3px 0 var(--ink);
  transition:transform .12s, box-shadow .12s;
}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.ghost{background:var(--card);color:var(--ink)}

.search{
  display:flex;align-items:center;gap:8px;background:var(--card);border:2px solid var(--ink);
  border-radius:12px;padding:0 12px;min-width:0;flex:1 1 220px;max-width:340px;
}
.search input{border:0;outline:0;background:transparent;font:inherit;padding:9px 0;min-width:0;flex:1;color:var(--ink)}
.search svg{flex:none}

/* ---------- 海圖 ---------- */
.chart{
  position:relative;border:3px solid var(--ink);border-radius:22px;overflow:hidden;
  background:var(--sea);box-shadow:5px 5px 0 var(--ink);
}
.chart svg{display:block;width:100%;height:auto}
.island{cursor:pointer}
.island .land{transition:transform .25s ease;transform-box:fill-box;transform-origin:center}
.island:hover .land,.island:focus-visible .land{transform:scale(1.05)}
.island:focus{outline:none}
.island:focus-visible .badge{stroke:var(--buoy);stroke-width:6}
.island .pulse{opacity:0}
.island.on .pulse{opacity:1;animation:pulse 2.2s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.35);opacity:0}}
.waves{animation:drift 14s linear infinite}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-80px)}}
.compass{position:absolute;right:14px;bottom:10px;font-family:var(--font-display);color:#fff;font-size:12px;opacity:.85;letter-spacing:.1em}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{
  cursor:pointer;display:flex;align-items:center;gap:6px;border:2px solid var(--ink);border-radius:999px;
  background:var(--card);padding:4px 12px 4px 4px;font-family:var(--font-display);font-weight:700;font-size:14px;
}
.chip i{
  font-style:normal;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:14px;
}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.chip em{font-style:normal;font-weight:500;font-size:12px;opacity:.7;font-variant-numeric:tabular-nums}

/* ---------- 碼頭面板 ---------- */
.dock{margin-top:28px}
.dock-head{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;margin-bottom:18px}
.dock-flag{
  width:58px;height:58px;border-radius:16px;border:3px solid var(--ink);display:grid;place-items:center;
  font-family:var(--font-display);font-weight:900;font-size:30px;color:#fff;box-shadow:3px 3px 0 var(--ink);flex:none;
}
.dock-head h2{font-family:var(--font-display);font-size:28px;margin:0;line-height:1.1}
.dock-head p{margin:2px 0 0;color:var(--ink-soft)}
.dock-head .grow{flex:1;min-width:0}

.channels{display:grid;gap:22px}
.channel{
  background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:16px;
}
.channel-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin-bottom:12px}
.channel-top h3{font-family:var(--font-display);font-size:19px;margin:0}
.channel-top span{color:var(--ink-soft);font-size:13.5px}
.channel-top .subs{
  margin-left:auto;font-size:12px;font-weight:700;border:1.5px solid var(--line);border-radius:999px;padding:1px 10px;
  font-variant-numeric:tabular-nums;color:var(--ink-soft)
}
.vids{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.vid{
  cursor:pointer;text-align:left;border:0;background:transparent;padding:0;display:flex;flex-direction:column;gap:8px;min-width:0;position:relative;
}
.thumb{
  position:relative;aspect-ratio:16/9;max-width:100%;border-radius:12px;overflow:hidden;border:2px solid var(--ink);
  background:var(--shallow);
}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.vid:hover .thumb img{transform:scale(1.05)}
.thumb .play{
  position:absolute;inset:auto auto 8px 8px;width:34px;height:34px;border-radius:50%;background:var(--buoy);
  border:2px solid var(--ink);display:grid;place-items:center;
}
.vid h4{margin:0;font-size:14.5px;line-height:1.4;font-weight:700}
.vid small{color:var(--ink-soft);font-size:12.5px;font-variant-numeric:tabular-nums}
.vid small b{font-weight:500;color:var(--ink)}
.stampmark{

  border:3px double var(--stamp);color:var(--stamp);background:rgba(255,255,255,.88);
  display:grid;place-items:center;transform:rotate(-14deg);
  font-family:var(--font-display);font-weight:900;font-size:13px;line-height:1.05;text-align:center;

.empty{padding:28px;border:2px dashed var(--line);border-radius:18px;text-align:center;color:var(--ink-soft)}

.cabin-bar .focus{font-size:13px;opacity:.7}

.screen iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

.cabin .btn.ghost{background:transparent;color:#f4efe2;border-color:#f4efe2;box-shadow:3px 3px 0 #f4efe2}
.cabin .btn{box-shadow:3px 3px 0 #f4efe2;border-color:#f4efe2}
.cabin .btn.done{background:var(--stamp)}
.cabin details{font-size:13px;opacity:.7}

.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

footer{margin-top:40px;color:var(--ink-soft);font-size:13px}

@media (prefers-reduced-motion:reduce){

/* ===== 工具 ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const NS="http://www.w3.org/2000/svg";
function rng(seed){return()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646}}
function blob(cx,cy,r,seed,wob=.2,n=13){
  const R=rng(seed),pts=[];
  for(let i=0;i<n;i++){const a=i/n*Math.PI*2,k=r*(1-wob/2+R()*wob);pts.push([cx+Math.cos(a)*k*1.12,cy+Math.sin(a)*k*.86])}
  let d="";
  for(let i=0;i<n;i++){
    const p0=pts[(i-1+n)%n],p1=pts[i],p2=pts[(i+1)%n],p3=pts[(i+2)%n];
    if(i===0)d+=`M${p1[0].toFixed(1)},${p1[1].toFixed(1)}`;
    const c1=[p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6],c2=[p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6];
    d+=`C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return d+"Z";
}
function mix(hex,amt){ // 與白色混合
  const n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;
  const f=c=>Math.round(c+(255-c)*amt);return`rgb(${f(r)},${f(g)},${f(b)})`;
}
function islandDone(is){let t=0,d=0;is.ch.forEach(c=>c[3].forEach(v=>{t++;if(stamps.has(v[0]))d++}));return[d,t]}

/* ===== 畫海圖 ===== */
function drawMap(){
  const svg=$("#map");svg.innerHTML="";
  const defs=document.createElementNS(NS,"defs");
  defs.innerHTML=`<pattern id="wv" width="80" height="40" patternUnits="userSpaceOnUse">
     <path d="M6 22 q8 -8 16 0 t16 0" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="2.4" stroke-linecap="round"/>
     <path d="M46 6 q6 -6 12 0 t12 0" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="2" stroke-linecap="round"/></pattern>
   <radialGradient id="seaG" cx="50%" cy="50%" r="70%"><stop offset="0" stop-color="#3aa3c2"/><stop offset="1" stop-color="#1d6a88"/></radialGradient>`;
  svg.appendChild(defs);
  svg.insertAdjacentHTML("beforeend",`<rect width="1000" height="640" fill="url(#seaG)"/>
    <g class="waves"><rect x="0" y="0" width="1100" height="640" fill="url(#wv)"/></g>`);

  // 航線
  const hub=ISLANDS[0];const routes=document.createElementNS(NS,"g");
  ISLANDS.slice(1).forEach((is,i)=>{
    const mx=(hub.x+is.x)/2+(i%2?30:-30),my=(hub.y+is.y)/2+(i%2?-24:24);
    const p=document.createElementNS(NS,"path");
    p.setAttribute("d",`M${hub.x},${hub.y} Q${mx},${my} ${is.x},${is.y}`);
    p.setAttribute("fill","none");p.setAttribute("stroke","rgba(255,255,255,.55)");
    p.setAttribute("stroke-width","2.5");p.setAttribute("stroke-dasharray","2 10");p.setAttribute("stroke-linecap","round");
    if(i===2)p.id="route";
    routes.appendChild(p);
  });
  svg.appendChild(routes);

  // 小船
  svg.insertAdjacentHTML("beforeend",`<g id="boat"><path d="M-14,0 L14,0 L9,8 L-9,8 Z" fill="#fbf7ec" stroke="#16313b" stroke-width="2"/>
    <path d="M0,-20 L0,0 M0,-20 L12,-4 L0,-4" fill="#ff6b3d" stroke="#16313b" stroke-width="2" stroke-linejoin="round"/>
    <animateMotion dur="16s" repeatCount="indefinite" rotate="0" keyPoints="0;1;0" keyTimes="0;.5;1" calcMode="linear"><mpath href="#route"/></animateMotion></g>`);
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)$("#boat animateMotion")?.remove();

  ISLANDS.forEach((is,i)=>{
    const g=document.createElementNS(NS,"g");
    g.setAttribute("class","island"+(is.key===current?" on":""));
    g.setAttribute("tabindex","0");g.setAttribute("role","button");
    const [d,t]=islandDone(is);
    g.setAttribute("aria-label",`${is.name}，${is.ch.length} 位老師，已蓋 ${d} / ${t} 個郵戳`);
    const seed=(i+3)*7919;
    const circ=2*Math.PI*30, frac=t?d/t:0;
    g.innerHTML=`
      <path class="pulse" d="${blob(is.x,is.y,is.r+26,seed,.12)}" fill="none" stroke="#fff" stroke-width="3"/>
      <g class="land">
        <path d="${blob(is.x,is.y,is.r+16,seed,.16)}" fill="${'#86d0dc'}" opacity=".55"/>
        <path d="${blob(is.x,is.y+4,is.r+4,seed+1,.2)}" fill="rgba(10,40,52,.25)"/>
        <path d="${blob(is.x,is.y,is.r+4,seed+1,.2)}" fill="#f4e1b0" stroke="#16313b" stroke-width="2.5"/>
        <path d="${blob(is.x,is.y-3,is.r-8,seed+2,.28)}" fill="${mix(is.color,.55)}"/>
        ${trees(is,seed)}
        <circle cx="${is.x}" cy="${is.y-4}" r="30" fill="${is.color}" stroke="#16313b" stroke-width="3" class="badge"/>
        <circle cx="${is.x}" cy="${is.y-4}" r="30" fill="none" stroke="#c8372d" stroke-width="5" stroke-linecap="round"
          stroke-dasharray="${(circ*frac).toFixed(1)} ${circ.toFixed(1)}" transform="rotate(-90 ${is.x} ${is.y-4})" opacity="${frac?1:0}"/>
        <text x="${is.x}" y="${is.y+7}" text-anchor="middle" font-family="Chiron GoRound TC, Noto Sans TC, sans-serif" font-weight="900" font-size="30" fill="#fff">${is.glyph}</text>
      </g>
      <g transform="translate(${is.x},${is.y+is.r+12})">
        <rect x="-50" y="-14" width="100" height="28" rx="9" fill="#fbf7ec" stroke="#16313b" stroke-width="2.5"/>
        <text x="0" y="6" text-anchor="middle" font-family="Chiron GoRound TC, Noto Sans TC, sans-serif" font-weight="700" font-size="17" fill="#16313b">${is.name}</text>
      </g>`;
    g.addEventListener("click",()=>select(is.key,true));
    g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();select(is.key,true)}});
    svg.appendChild(g);
  });
}
function trees(is,seed){
  const R=rng(seed+9);let s="";const n=is.r>60?4:3;
  for(let k=0;k<n;k++){
    const a=-Math.PI*.9+k*(Math.PI*1.8/(n-1))+R()*.3, rr=is.r*.62;
    const x=is.x+Math.cos(a)*rr*1.1,y=is.y+Math.sin(a)*rr*.82;
    if(Math.abs(y-(is.y-4))<26&&Math.abs(x-is.x)<40)continue;
    s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(6+R()*4).toFixed(1)}" fill="#3f8f45" stroke="#16313b" stroke-width="1.8"/>`;
  }
  return s;
}

function drawDock(){
  const q=$("#q").value.trim().toLowerCase();
  let html="";
  if(q){
    const hits=VIDEOS.filter(v=>(v.title+v.channel+v.teacher+v.island.name).toLowerCase().includes(q));
    html=`<div class="dock-head"><div class="dock-flag" style="background:#16313b">尋</div>
      <div class="grow"><h2>搜尋「${esc(q)}」</h2><p>找到 ${hits.length} 支影片</p></div>
      <button class="btn ghost" type="button" id="clearQ">清除搜尋</button></div>`;
    html+=hits.length?`<div class="channel"><div class="vids">${hits.map(v=>vidTile(v).replace("<h4>",`<h4><span style="color:${v.island.color}">${v.island.glyph}・</span>`)).join("")}</div></div>`
      :`<div class="empty">沒有找到相關影片，換個關鍵字試試，例如「段考」「會考」或老師名字。</div>`;
  }else{
    const is=ISLANDS.find(i=>i.key===current);const[d,t]=islandDone(is);
    html=`<div class="dock-head"><div class="dock-flag" style="background:${is.color}">${is.glyph}</div>
      <div class="grow"><h2>${is.name}</h2><p>${is.desc}　${is.ch.length} 位老師・郵戳 ${d} / ${t}</p></div></div>
      <div class="channels">${is.ch.map(c=>`<article class="channel">
        <div class="channel-top"><h3>${esc(c[0])}</h3><span>${esc(c[1])}</span><span class="subs">${esc(c[2])} 訂閱</span></div>
        <div class="vids">${c[3].map(v=>vidTile(VIDEOS.find(x=>x.id===v[0]))).join("")}</div></article>`).join("")}</div>`;
  }
  $("#dock").innerHTML=html;
  $("#dock").querySelectorAll(".vid").forEach(b=>b.addEventListener("click",()=>openVideo(b.dataset.id)));
  $("#clearQ")?.addEventListener("click",()=>{$("#q").value="";drawDock()});
}

/* ===== 專注播放艙 ===== */
let playing=null,lastFocus=null;
function playlistFor(v){ // 搜尋中依搜尋結果，否則依該島順序
  const q=$("#q").value.trim().toLowerCase();
  return q?VIDEOS.filter(x=>(x.title+x.channel+x.teacher+x.island.name).toLowerCase().includes(q)):VIDEOS.filter(x=>x.island===v.island);
}
function openVideo(id){
  const v=VIDEOS.find(x=>x.id===id);if(!v)return;
  if(!playing)lastFocus=document.activeElement;
  playing=v;
  const src=`https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0&playsinline=1&iv_load_policy=3&modestbranding=1`;
  $("#screen").innerHTML=`<iframe src="${src}" title="${esc(v.title)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
  $("#cabinTag").textContent=v.island.name;$("#cabinTag").style.background=v.island.color;
  $("#cabinTitle").textContent=v.title;
  $("#cabinMeta").textContent=`${v.channel}・${v.teacher}・${v.views} 次觀看`;
  $("#ytFallback").href=`https://www.youtube.com/watch?v=${id}`;
  setDone();
  $("#cabin").hidden=false;document.body.style.overflow="hidden";
  $("#closeBtn").focus();
}
function setDone(){
  const d=stamps.has(playing.id);
  $("#doneBtn").textContent=d?"已蓋郵戳（再按取消）":"看完了，蓋郵戳";
}
function closeVideo(){
  $("#screen").innerHTML="";$("#cabin").hidden=true;document.body.style.overflow="";playing=null;
  refresh();lastFocus?.focus?.();
}
function step(dir){
  const list=playlistFor(playing);const i=list.findIndex(x=>x.id===playing.id);
  openVideo(list[(i+dir+list.length)%list.length].id);
}
$("#closeBtn").addEventListener("click",closeVideo);
$("#prevBtn").addEventListener("click",()=>step(-1));
$("#nextBtn").addEventListener("click",()=>step(1));
$("#doneBtn").addEventListener("click",()=>{
  if(stamps.has(playing.id)){stamps.delete(playing.id)}else{stamps.add(playing.id);toast(`蓋上郵戳！已收集 ${stamps.size} / ${VIDEOS.length}`)}
  saveStamps();setDone();updatePassport();
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&playing)closeVideo()});

$("#randomBtn").addEventListener("click",()=>{
  const pool=VIDEOS.filter(v=>!stamps.has(v.id));const list=pool.length?pool:VIDEOS;
  const v=list[Math.floor(Math.random()*list.length)];
  current=v.island.key;try{localStorage.setItem("islands-current",current)}catch(e){}
  $("#q").value="";refresh();openVideo(v.id);
});
let qt;$("#q").addEventListener("input",()=>{clearTimeout(qt);qt=setTimeout(drawDock,150)});

let tt;function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),2200)}

refresh();
</script>
</body>
</html>
